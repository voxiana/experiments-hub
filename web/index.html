<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI CX - Demo Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .status.disconnected {
            background: #fee;
            color: #c33;
        }

        .status.connected {
            background: #efe;
            color: #3c3;
        }

        .status.active {
            background: #ffc;
            color: #960;
        }

        .status.speaking {
            background: #e6f3ff;
            color: #0066cc;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .transcript {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #e6f7ff;
            border-left: 4px solid #1890ff;
        }

        .message.assistant {
            background: #f6ffed;
            border-left: 4px solid #52c41a;
        }

        .message.interim {
            background: #fff7e6;
            border-left: 4px solid #faad14;
            font-style: italic;
            opacity: 0.8;
        }

        .message .role {
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .message .text {
            color: #333;
            line-height: 1.6;
        }

        .message .timestamp {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .message .message-latency {
            font-size: 0.75em;
            color: #666;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
            font-family: monospace;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metric .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .metric .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .audio-visualizer {
            width: 100%;
            height: 60px;
            background: #f7fafc;
            border-radius: 8px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            opacity: 0.3;
            transform-origin: bottom;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(0.8); }
        }

        .language-selector {
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            font-size: 1em;
            width: 100%;
        }

        .latency-breakdown {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .latency-breakdown h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .latency-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .latency-item {
            display: grid;
            grid-template-columns: 180px 1.4fr 1fr 80px;
            grid-template-areas: "label output bar value";
            align-items: center;
            gap: 15px;
        }

        .latency-label {
            grid-area: label;
            font-size: 0.9em;
            color: #555;
            white-space: nowrap;
        }

        .latency-output {
            grid-area: output;
            font-size: 0.82em;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .latency-bar-container {
            grid-area: bar;
            height: 24px;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .latency-bar {
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s ease-out;
            width: 0%;
        }

        .asr-bar {
            background: linear-gradient(90deg, #3182ce, #63b3ed);
        }

        .model-bar {
            background: linear-gradient(90deg, #805ad5, #b794f4);
        }

        .tts-bar {
            background: linear-gradient(90deg, #38a169, #68d391);
        }

        .latency-value {
            grid-area: value;
            font-weight: bold;
            font-size: 0.95em;
            color: #333;
            text-align: right;
        }

        @media (max-width: 600px) {
            .latency-item {
                grid-template-columns: 1fr 60px;
                grid-template-areas:
                    "label value"
                    "output value";
                gap: 8px;
            }
            .latency-label {
                font-size: 0.8em;
            }
            .latency-output {
                font-size: 0.75em;
            }
            .latency-bar-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Voice AI CX</h1>
            <p>Real-time Voice Customer Care Platform</p>
        </div>

        <div id="status" class="status disconnected">
            Disconnected
        </div>

        <div class="language-selector">
            <label for="language">Language:</label>
            <select id="language">
                <option value="auto">Auto-detect</option>
                <option value="ar">Arabic (العربية)</option>
                <option value="en" selected>English</option>
            </select>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-primary" onclick="startCall()">
                🎙️ Start Call
            </button>
            <button id="endBtn" class="btn-danger" onclick="endCall()" disabled>
                ⏹️ End Call
            </button>
        </div>

        <div class="audio-visualizer" id="visualizer" style="display: none;">
            <div class="wave"></div>
        </div>

        <div class="transcript" id="transcript">
            <p style="color: #999; text-align: center;">
                Click "Start Call" to begin your conversation
            </p>
        </div>

        <div class="metrics">
            <div class="metric">
                <div class="label">Duration</div>
                <div class="value" id="duration">0:00</div>
            </div>
            <div class="metric">
                <div class="label">Turns</div>
                <div class="value" id="turns">0</div>
            </div>
            <div class="metric">
                <div class="label">Total Latency</div>
                <div class="value" id="latency">-</div>
            </div>
        </div>

        <div class="latency-breakdown">
            <h3>⏱️ Latency Breakdown</h3>
            <div class="latency-items">
                <div class="latency-item">
                    <span class="latency-label">🎤 ASR (Speech-to-Text)</span>
                    <span class="latency-output" id="asr-output">...</span>
                    <span class="latency-bar-container">
                        <span class="latency-bar asr-bar" id="asr-bar"></span>
                    </span>
                    <span class="latency-value" id="asr-latency">-</span>
                </div>
                <div class="latency-item">
                    <span class="latency-label">🧠 Model (LLM Response)</span>
                    <span class="latency-output" id="model-output">...</span>
                    <span class="latency-bar-container">
                        <span class="latency-bar model-bar" id="model-bar"></span>
                    </span>
                    <span class="latency-value" id="model-latency">-</span>
                </div>
                <div class="latency-item">
                    <span class="latency-label">🔊 TTS (Text-to-Speech)</span>
                    <span class="latency-output" id="tts-output">...</span>
                    <span class="latency-bar-container">
                        <span class="latency-bar tts-bar" id="tts-bar"></span>
                    </span>
                    <span class="latency-value" id="tts-latency">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let ws = null;
        let mediaRecorder = null;
        let audioContext = null;
        let callId = null;
        let startTime = null;
        let turnCount = 0;
        let isRecording = false;
        let currentAudio = null;
        let isProcessing = false;  // True when waiting for ASR/NLU/TTS response
        let isSpeaking = false;    // True when TTS audio is playing
        let bargeInEnabled = true; // Enable/disable barge-in feature

        // Update status display
        function updateStatus(status, text) {
            const statusEl = document.getElementById('status');
            // Map states to CSS classes
            let cssClass = status;
            if (text.includes('Speaking')) {
                cssClass = 'speaking';
            }
            statusEl.className = `status ${cssClass}`;
            statusEl.textContent = text;
        }

        // Add message to transcript
        function addMessage(role, text, interim = false, latencyInfo = null) {
            const transcript = document.getElementById('transcript');

            // Remove previous interim message if exists
            if (interim) {
                const prevInterim = transcript.querySelector('.message.interim');
                if (prevInterim) prevInterim.remove();
            }

            const message = document.createElement('div');
            message.className = `message ${interim ? 'interim' : role}`;
            
            let latencyHtml = '';
            if (latencyInfo && role === 'assistant') {
                latencyHtml = `<div class="message-latency">⏱️ ASR: ${(latencyInfo.asr_ms/1000).toFixed(2)}s | Model: ${(latencyInfo.model_ms/1000).toFixed(2)}s | TTS: ${(latencyInfo.tts_ms/1000).toFixed(2)}s</div>`;
            }
            
            message.innerHTML = `
                <div class="role">${role === 'user' ? '👤 You' : '🤖 Assistant'}</div>
                <div class="text">${text}</div>
                ${latencyHtml}
                <div class="timestamp">${new Date().toLocaleTimeString()}</div>
            `;

            transcript.appendChild(message);
            transcript.scrollTop = transcript.scrollHeight;

            if (!interim) {
                turnCount++;
                document.getElementById('turns').textContent = turnCount;
            }
        }

        // Update duration timer
        function updateDuration() {
            if (!startTime) return;

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('duration').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Start call
        async function startCall() {
            try {
                // Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Initialize audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Get JWT token (in production, implement proper auth)
                const token = await getAuthToken();

                // Create call session
                const response = await fetch('http://localhost:8000/call/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        tenant_id: 'demo',
                        language: document.getElementById('language').value,
                        voice_id: 'arabic_gulf_male',
                        metadata: { source: 'web_demo' },
                    }),
                });

                const data = await response.json();
                callId = data.call_id;

                // Connect WebSocket
                ws = new WebSocket(`ws://localhost:8000/ws/${callId}`);

                ws.onopen = () => {
                    updateStatus('connected', 'Connected - Listening...');
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('endBtn').disabled = false;
                    document.getElementById('visualizer').style.display = 'block';

                    // Clear transcript
                    document.getElementById('transcript').innerHTML = '';

                    // Start recording
                    startRecording(stream);

                    // Start duration timer
                    startTime = Date.now();
                    setInterval(updateDuration, 1000);
                };

                ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    handleServerMessage(message);
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateStatus('disconnected', 'Connection error');
                };

                ws.onclose = () => {
                    updateStatus('disconnected', 'Disconnected');
                    stopRecording();
                };

            } catch (error) {
                console.error('Error starting call:', error);
                alert('Failed to start call: ' + error.message);
            }
        }

        // End call
        async function endCall() {
            if (ws) {
                ws.close();
            }

            stopRecording();

            // Call end endpoint
            const token = await getAuthToken();
            await fetch(`http://localhost:8000/call/${callId}/end`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                },
            });

            document.getElementById('startBtn').disabled = false;
            document.getElementById('endBtn').disabled = true;
            document.getElementById('visualizer').style.display = 'none';

            startTime = null;
        }

        // Start recording with raw PCM using AudioWorklet/ScriptProcessor
        function startRecording(stream) {
            // Use AudioContext to capture raw PCM data
            const source = audioContext.createMediaStreamSource(stream);
            
            // Buffer to accumulate samples before sending
            let audioBuffer = [];
            const MIN_SAMPLES = 32000; // Minimum 2 seconds at 16kHz before sending
            const MAX_SAMPLES = 80000; // Maximum 5 seconds at 16kHz
            const SILENCE_THRESHOLD = 0.01; // Energy threshold for speech detection
            const BARGE_IN_THRESHOLD = 0.03; // Higher threshold for barge-in (avoid speaker bleed)
            const SILENCE_DURATION = 16000; // 1 second of silence triggers send (at 16kHz)
            let consecutiveBargeInFrames = 0; // Need sustained speech for barge-in
            const BARGE_IN_FRAMES_REQUIRED = 3; // ~300ms of speech for barge-in
            
            let speechDetected = false;
            let silenceSamples = 0;
            let lastSendTime = Date.now();
            
            // Create a ScriptProcessorNode (or AudioWorklet for better performance)
            // Note: ScriptProcessorNode is deprecated but widely supported
            const processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            processor.onaudioprocess = (event) => {
                if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
                
                const inputData = event.inputBuffer.getChannelData(0);
                
                // Resample to 16kHz if needed (most browsers use 44.1kHz or 48kHz)
                const sampleRate = audioContext.sampleRate;
                const targetRate = 16000;
                const resampledData = resampleAudio(inputData, sampleRate, targetRate);
                
                // Calculate RMS energy for voice activity detection
                const energy = calculateEnergy(resampledData);
                const isSpeech = energy > SILENCE_THRESHOLD;
                const isLoudSpeech = energy > BARGE_IN_THRESHOLD;
                
                // Barge-in detection: If user speaks loudly while TTS is playing, stop it
                // Requires sustained speech to avoid false triggers from speaker bleed
                if (isSpeaking && bargeInEnabled) {
                    if (isLoudSpeech) {
                        consecutiveBargeInFrames++;
                        if (consecutiveBargeInFrames >= BARGE_IN_FRAMES_REQUIRED) {
                            console.log(`🎤 Barge-in detected! Energy: ${energy.toFixed(4)}, frames: ${consecutiveBargeInFrames}`);
                            triggerBargeIn();
                            consecutiveBargeInFrames = 0;
                        }
                    } else {
                        consecutiveBargeInFrames = 0;
                    }
                }
                
                // Don't accumulate audio while processing (prevents queue buildup)
                if (isProcessing) {
                    return;
                }
                
                if (isSpeech) {
                    speechDetected = true;
                    silenceSamples = 0;
                } else if (speechDetected) {
                    silenceSamples += resampledData.length;
                }
                
                // Only accumulate if speech has been detected
                if (speechDetected) {
                    audioBuffer = audioBuffer.concat(Array.from(resampledData));
                }
                
                // Determine if we should send the audio
                const shouldSend = speechDetected && (
                    // Send after silence following speech (end of utterance)
                    (silenceSamples >= SILENCE_DURATION && audioBuffer.length >= MIN_SAMPLES) ||
                    // Send if buffer is getting too large
                    (audioBuffer.length >= MAX_SAMPLES) ||
                    // Force send every 10 seconds if there's pending audio
                    (audioBuffer.length >= MIN_SAMPLES && Date.now() - lastSendTime > 10000)
                );
                
                if (shouldSend && audioBuffer.length > 0) {
                    console.log(`Sending ${audioBuffer.length} samples (${(audioBuffer.length/16000).toFixed(2)}s), energy: ${energy.toFixed(4)}`);
                    
                    // Mark as processing - don't accept new audio until response
                    isProcessing = true;
                    updateStatus('active', 'Processing your speech...');
                    
                    // Convert float32 to int16 PCM
                    const int16Data = new Int16Array(audioBuffer.length);
                    for (let i = 0; i < audioBuffer.length; i++) {
                        const s = Math.max(-1, Math.min(1, audioBuffer[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    
                    // Convert to base64
                    const base64 = arrayBufferToBase64(int16Data.buffer);
                    
                    ws.send(JSON.stringify({
                        type: 'audio',
                        data: base64,
                        format: 'pcm16',
                        sampleRate: 16000,
                    }));
                    
                    // Reset state
                    audioBuffer = [];
                    speechDetected = false;
                    silenceSamples = 0;
                    lastSendTime = Date.now();
                }
            };
            
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            // Store references for cleanup
            mediaRecorder = { 
                processor, 
                source, 
                stream,
                stop: () => {
                    processor.disconnect();
                    source.disconnect();
                }
            };
            isRecording = true;
        }
        
        // Calculate RMS energy of audio samples
        function calculateEnergy(samples) {
            let sum = 0;
            for (let i = 0; i < samples.length; i++) {
                sum += samples[i] * samples[i];
            }
            return Math.sqrt(sum / samples.length);
        }
        
        // Resample audio from source rate to target rate
        function resampleAudio(inputData, sourceSampleRate, targetSampleRate) {
            if (sourceSampleRate === targetSampleRate) {
                return inputData;
            }
            
            const ratio = sourceSampleRate / targetSampleRate;
            const outputLength = Math.round(inputData.length / ratio);
            const output = new Float32Array(outputLength);
            
            for (let i = 0; i < outputLength; i++) {
                const srcIndex = i * ratio;
                const srcIndexFloor = Math.floor(srcIndex);
                const srcIndexCeil = Math.min(srcIndexFloor + 1, inputData.length - 1);
                const fraction = srcIndex - srcIndexFloor;
                
                // Linear interpolation
                output[i] = inputData[srcIndexFloor] * (1 - fraction) + inputData[srcIndexCeil] * fraction;
            }
            
            return output;
        }
        
        // Convert ArrayBuffer to base64
        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // Stop recording
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
                isRecording = false;
                mediaRecorder = null;
            }
        }

        // Handle server messages
        function handleServerMessage(message) {
            switch (message.type) {
                case 'transcript_interim':
                    addMessage('user', message.text, true);
                    break;

                case 'transcript_final':
                    addMessage('user', message.text, false);
                    updateStatus('active', '🧠 Getting AI response...');
                    
                    // Show ASR latency early if available
                    if (message.latency && message.latency.asr_ms) {
                        updateLatencyDisplay({
                            asr_ms: message.latency.asr_ms,
                            model_ms: null,
                            tts_ms: null,
                            total_ms: null,
                        });
                    }
                    break;

                case 'response':
                    addMessage('assistant', message.text, false, message.latency);

                    // Play TTS audio if provided
                    if (message.audio) {
                        playAudio(message.audio);
                    } else {
                        // No audio, just reset processing state
                        isProcessing = false;
                        updateStatus('connected', 'Listening...');
                    }

                    // Update latency breakdown
                    if (message.latency) {
                        updateLatencyDisplay(message.latency);
                    }
                    updateComponentOutputs(message.component_outputs);
                    break;

                case 'error':
                    console.error('Server error:', message.error);
                    isProcessing = false;
                    isSpeaking = false;
                    updateStatus('disconnected', `Error: ${message.error}`);
                    break;

                case 'pong':
                    // Keepalive response
                    break;
            }
        }

        // Update latency display with breakdown
        function updateLatencyDisplay(latency) {
            const maxLatency = 10000; // Max scale for bars (10 seconds)
            
            // Update total latency
            if (latency.total_ms !== null && latency.total_ms !== undefined) {
                const totalSec = (latency.total_ms / 1000).toFixed(2);
                document.getElementById('latency').textContent = `${totalSec}s`;
            }
            
            // Update ASR latency
            if (latency.asr_ms !== null && latency.asr_ms !== undefined) {
                const asrSec = (latency.asr_ms / 1000).toFixed(2);
                document.getElementById('asr-latency').textContent = `${asrSec}s`;
                const asrBar = document.getElementById('asr-bar');
                asrBar.style.width = `${Math.min((latency.asr_ms / maxLatency) * 100, 100)}%`;
            }
            
            // Update Model latency
            if (latency.model_ms !== null && latency.model_ms !== undefined) {
                const modelSec = (latency.model_ms / 1000).toFixed(2);
                document.getElementById('model-latency').textContent = `${modelSec}s`;
                const modelBar = document.getElementById('model-bar');
                modelBar.style.width = `${Math.min((latency.model_ms / maxLatency) * 100, 100)}%`;
            } else {
                document.getElementById('model-latency').textContent = '...';
            }
            
            // Update TTS latency
            if (latency.tts_ms !== null && latency.tts_ms !== undefined) {
                const ttsSec = (latency.tts_ms / 1000).toFixed(2);
                document.getElementById('tts-latency').textContent = `${ttsSec}s`;
                const ttsBar = document.getElementById('tts-bar');
                ttsBar.style.width = `${Math.min((latency.tts_ms / maxLatency) * 100, 100)}%`;
            } else {
                document.getElementById('tts-latency').textContent = '...';
            }
        }

        function truncateOutputText(text, maxLength = 80) {
            if (typeof text !== 'string') {
                return '';
            }
            if (text.length <= maxLength) {
                return text;
            }
            return `${text.slice(0, maxLength - 3)}...`;
        }

        function setComponentOutput(elementId, outputText) {
            const element = document.getElementById(elementId);
            const hasText = typeof outputText === 'string' && outputText.trim().length > 0;
            if (hasText) {
                const trimmed = outputText.trim();
                element.textContent = truncateOutputText(trimmed);
                element.title = trimmed;
            } else {
                element.textContent = '...';
                element.title = '';
            }
        }

        function updateComponentOutputs(componentOutputs) {
            const outputs = componentOutputs || {};
            setComponentOutput('asr-output', outputs.asr_text);
            setComponentOutput('model-output', outputs.model_text);
            setComponentOutput('tts-output', outputs.tts_text);
        }

        // Trigger barge-in: stop TTS and notify server
        function triggerBargeIn() {
            // Stop TTS playback
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            isSpeaking = false;
            isProcessing = false;
            
            // Notify server about barge-in
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'barge_in',
                    timestamp: Date.now(),
                }));
            }
            
            updateStatus('connected', 'Listening... (interrupted)');
            
            // Add visual indicator
            addSystemMessage('🔇 Response interrupted - listening...');
        }
        
        // Add system message to transcript
        function addSystemMessage(text) {
            const transcript = document.getElementById('transcript');
            const message = document.createElement('div');
            message.className = 'message system';
            message.style.cssText = 'background: #f0f0f0; border-left: 4px solid #999; font-style: italic; font-size: 0.9em;';
            message.innerHTML = `<div class="text">${text}</div>`;
            transcript.appendChild(message);
            transcript.scrollTop = transcript.scrollHeight;
        }

        // Play TTS audio
        function playAudio(base64Audio) {
            // Stop current audio if playing
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            const audio = new Audio(`data:audio/wav;base64,${base64Audio}`);
            currentAudio = audio;
            
            // Track speaking state
            audio.onplay = () => {
                isSpeaking = true;
                updateStatus('active', '🔊 Speaking...');
                console.log('TTS playback started');
            };
            
            audio.onended = () => {
                isSpeaking = false;
                isProcessing = false;
                updateStatus('connected', 'Listening...');
                console.log('TTS playback ended');
            };
            
            audio.onpause = () => {
                isSpeaking = false;
                console.log('TTS playback paused');
            };
            
            audio.onerror = (error) => {
                console.error('Audio playback error:', error);
                isSpeaking = false;
                isProcessing = false;
                updateStatus('connected', 'Listening...');
            };

            audio.play().catch(error => {
                console.error('Audio playback error:', error);
                isSpeaking = false;
                isProcessing = false;
            });
        }

        // Get auth token (stub - implement proper auth)
        async function getAuthToken() {
            const response = await fetch('http://localhost:8000/auth/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'tenant_id=demo&api_key=demo_key',
            });

            const data = await response.json();
            return data.access_token;
        }

        // Keepalive ping every 30 seconds
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
